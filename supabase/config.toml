# Supabase CLI configuration, only used if you run the local stack
# (`npx supabase start`, requires Docker). The hosted project is configured in
# the dashboard instead; see README › Supabase.

project_id = "taller-reservas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Tu acceso al taller"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Confirma tu correo para reservar el taller"
content_path = "./supabase/templates/confirm-signup.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"
