<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Tu acceso al taller</title>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;color:#000000">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff">
      <tr>
        <td style="padding:24px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px">
            <tr>
              <td style="font:900 48px/0.9 'Roboto Condensed','Arial Narrow',Arial,sans-serif;color:#000;padding-bottom:28px">TALLER</td>
            </tr>
            <tr>
              <td style="font:700 40px/0.9 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;color:#000;padding-bottom:20px">Tu acceso</td>
            </tr>
            <tr>
              <td style="font:300 18px/1.3 Helvetica,Arial,sans-serif;color:#000;padding-bottom:24px">
                Pulsa el botón para entrar en las reservas del taller. Si abres este correo en otro dispositivo, escribe el código.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:28px">
                <!-- Built from SiteURL so it never depends on the redirect allowlist. Verification happens on POST (Safe Links proof). -->
                <a
                  href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email"
                  style="display:inline-block;border:1px solid #000;padding:12px 32px;font:400 14px/1 Helvetica,Arial,sans-serif;letter-spacing:0.05em;text-transform:uppercase;color:#000;text-decoration:none"
                  >Entrar</a
                >
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #000;padding:14px 0;font:400 14px/1.2 Helvetica,Arial,sans-serif;text-transform:uppercase">Código</td>
            </tr>
            <tr>
              <td style="border-bottom:1px solid #000;padding:0 0 14px;font:700 40px/1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:0.12em">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="padding-top:24px;font:400 13px/1.4 Helvetica,Arial,sans-serif;color:#000">
                El enlace y el código caducan en una hora. Si no has pedido este acceso, ignora este correo.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
