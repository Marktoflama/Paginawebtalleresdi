        - generic [ref=f19e148]:
          - generic [ref=f19e149]:
            - paragraph [ref=f19e150]: El plan de estudios del Grado en Diseño consta de 240 créditos, estructurados en 4 cursos de 60 créditos cada uno. Los dos primeros cursos están formados por asignaturas Obligatorias (O) y de Formación Básica (FB), comunes a todas las menciones. Aún así, en algunas asignaturas ya se imparten contenidos específicos y se desarrollan trabajos y actividades según el itinerario escogido.
            - paragraph [ref=f19e151]
            - paragraph [ref=f19e152]: Las asignaturas especializadas y Optativas (OP) se imparten a partir del tercer curso y profundizan en conocimientos teóricos y prácticos específicos de cada mención. Las materias se complementan con la realización de prácticas obligatorias en empresas y el desarrollo del Trabajo Final de Grado, que supone el último registro pedagógico para evaluar los conocimientos adquiridos por el alumnado durante el periodo de formación.
            - paragraph [ref=f19e153]
            - paragraph [ref=f19e154]: "Estas son las asignaturas comunes a todas las menciones:"
