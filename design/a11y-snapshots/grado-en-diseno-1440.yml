        - generic [ref=f19e305]:
          - paragraph [ref=f19e306]: "A lo largo del Grado en Diseño, el alumnado desarrollará un conjunto de competencias transversales y específicas que le permitirán afrontar con solvencia los retos propios de la profesión. Entre las principales capacidades adquiridas destacan:"
