              - paragraph [ref=f19e248]: Apostamos por los programas de movilidad, tanto de estudiantes como de profesorado y staff, como una vía de intercambio de recursos, conocimientos y metodologías que enriquecen y completan la experiencia internacional de estudiar diseño en ESDI.
