            - paragraph [ref=f19e242]: En ESDI impulsamos la movilidad de nuestros estudiantes mediante programas de intercambio con universidades internacionales referentes en las diferentes disciplinas del diseño. Contamos con más de 50 convenios con distintos centros de 25 países diferentes de Europa, América Latina y Asia.
