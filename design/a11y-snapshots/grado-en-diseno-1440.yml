        - heading [level=2] [ref=f19e195]:
          - paragraph [ref=f19e196]: Titulación
        - paragraph [ref=f19e199]: Es un grado oficial universitario expedido por la Universidad Ramon Llull, y reconocido y homologado en el EEES (Espacio Europeo de Educación Superior). La calidad del Grado en Diseño de ESDI está acreditada por la AQU (Agencia para la Calidad del Sistema Universitario de Cataluña).
