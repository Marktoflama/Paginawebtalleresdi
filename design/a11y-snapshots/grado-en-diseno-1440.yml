        - heading [level=2] [ref=f19e49]:
          - paragraph [ref=f19e50]: INTRODUCCIÓN
        - generic [ref=f19e51]:
          - paragraph [ref=f19e53]: El método docente de ESDI busca el equilibrio entre los fundamentos teóricos que suponen la base del aprendizaje, las herramientas y los lenguajes que permiten llevar las ideas a la práctica, y el acercamiento a la realidad profesional gracias a la colaboración con empresas.
          - paragraph [ref=f19e55]: "Esto se transmite mediante tres tipologías de asignaturas: las conceptuales, que aportan conocimientos y competencias del ámbito de las Humanidades y las Ciencias Sociales; las instrumentales, que muestran las herramientas y los materiales para entender los tipos de productos a diseñar; y las asignaturas proyectuales, que enseñan la metodología de trabajo del diseño."
