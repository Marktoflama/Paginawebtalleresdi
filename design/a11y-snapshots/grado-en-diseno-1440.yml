            - img "Mostrar" [ref=f19e208]
        - generic:
          - generic [ref=f19e209]:
            - paragraph [ref=f19e210]: El Grado en Diseño está pensado para personas creativas, curiosas y con interés por transformar ideas en proyectos que generen impacto cultural, social o empresarial. Es una formación ideal para quienes deseen explorar la moda, el diseño gráfico, el audiovisual, el diseño de producto o el de interiores, con una base académica sólida y un enfoque multidisciplinar.
            - paragraph [ref=f19e211]: También se dirige a estudiantes que buscan una preparación universitaria con proyección internacional y una clara orientación profesional. Si te interesa unir creatividad, innovación y pensamiento crítico para aportar soluciones en un mundo en constante cambio, este grado te ofrece el entorno y las herramientas necesarias para hacerlo.
          - list [ref=f19e212]:
            - listitem [ref=f19e213]:
              - paragraph [ref=f19e214]: Proporcionar una formación sólida en los fundamentos teóricos, metodológicos y técnicos del diseño.
            - listitem [ref=f19e215]:
              - paragraph [ref=f19e216]: Desarrollar la capacidad de análisis, síntesis y resolución de problemas en contextos creativos y profesionales.
            - listitem [ref=f19e217]:
              - paragraph [ref=f19e218]: Potenciar la creatividad y la innovación como herramientas clave en el proceso de diseño.
            - listitem [ref=f19e219]:
              - paragraph [ref=f19e220]: Capacitar al alumnado para investigar, conceptualizar y materializar proyectos en diferentes ámbitos del diseño.
            - listitem [ref=f19e221]:
              - paragraph [ref=f19e222]: Fomentar el uso crítico y responsable de las tecnologías aplicadas al diseño.
            - listitem [ref=f19e223]:
              - paragraph [ref=f19e224]: Integrar conocimientos de cultura visual, historia y teoría del diseño para fundamentar la práctica profesional.
            - listitem [ref=f19e225]:
              - paragraph [ref=f19e226]: Impulsar la interdisciplinariedad y la colaboración en proyectos colectivos.
            - listitem [ref=f19e227]:
              - paragraph [ref=f19e228]: Promover competencias en sostenibilidad, ética y responsabilidad social vinculadas a la práctica del diseño.
            - listitem [ref=f19e229]:
              - paragraph [ref=f19e230]: Favorecer el desarrollo de una visión internacional y la adaptación a entornos multiculturales.
            - listitem [ref=f19e231]:
              - paragraph [ref=f19e232]: Preparar al alumnado para la inserción laboral y la continuación de estudios en programas de posgrado e investigación.
