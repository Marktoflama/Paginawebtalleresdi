      - generic [ref=f19e317]:
        - heading "FAQs" [level=2] [ref=f19e318]
        - list [ref=f19e320]:
          - listitem [ref=f19e321]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Se trata de un Grado Universitario Oficial?" [ref=f19e322] [cursor=pointer]':
              - paragraph [ref=f19e323]: ¿Se trata de un Grado Universitario Oficial?
              - img "Mostrar" [ref=f19e325]
            - paragraph [ref=f19e327]: Sí. El Grado en Diseño de ESDI es una titulación universitaria oficial expedida por la Universitat Ramon Llull y reconocida dentro del Espacio Europeo de Educación Superior (EEES). Además, cuenta con la acreditación de calidad de la Agencia para la Calidad del Sistema Universitario de Cataluña (AQU).
          - listitem [ref=f19e328]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Cómo es el proceso de admisión al Grado Universitario?" [ref=f19e329] [cursor=pointer]':
              - paragraph [ref=f19e330]: ¿Cómo es el proceso de admisión al Grado Universitario?
              - img "Mostrar" [ref=f19e332]
            - paragraph [ref=f19e334]: El proceso de admisión está diseñado para conocer el perfil, la motivación y el potencial creativo de cada candidato/da. Para acceder al Grado, hay que cumplir alguna de las vías de acceso universitarias establecidas y realizar una prueba de admisión en línea de carácter creativo. Una vez superada la prueba, recibirás la carta de admisión y podrás formalizar la reserva de plaza.
          - listitem [ref=f19e335]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Cómo es el proceso de admisión al Grado Universitario por alumnos internacionales?" [ref=f19e336] [cursor=pointer]':
              - paragraph [ref=f19e337]: ¿Cómo es el proceso de admisión al Grado Universitario por alumnos internacionales?
              - img "Mostrar" [ref=f19e339]
            - paragraph [ref=f19e341]: Los estudiantes internacionales tienen que disponer de los estudios previos homologados o haber iniciado el proceso de homologación al sistema educativo español. Igual que el resto de candidatos, tendrán que realizar la prueba de admisión y seguir el proceso de reserva de plaza. El equipo de Admisiones acompaña el estudiante durante todas las fases del proceso.
          - listitem [ref=f19e342]:
            - 'button "Mostrar u ocultar la respuesta a: Cómo funcionan las especialidades al Grado Universitario?" [ref=f19e343] [cursor=pointer]':
              - paragraph [ref=f19e344]: Cómo funcionan las especialidades al Grado Universitario?
              - img "Mostrar" [ref=f19e346]
            - paragraph [ref=f19e348]: "El Grado en Diseño ofrece cinco menciones o especialidades: Diseño de Moda, Diseño Gráfico, Diseño de Interiores, Diseño de Producto y Diseño Audiovisual. Durante los dos primeros cursos, los estudiantes cursan una base común de conocimientos y metodologías de diseño. Aun así, en algunas asignaturas ya se imparten temarios específicos y se desarrollan trabajos y actividades según el itinerario escogido. A partir del tercer curso, las asignaturas se especializan según la mención escogida, permitiendo profundizar en el ámbito profesional de interés."
          - listitem [ref=f19e349]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Qué modalidades de pago se ofrecen?" [ref=f19e350] [cursor=pointer]':
              - paragraph [ref=f19e351]: ¿Qué modalidades de pago se ofrecen?
              - img "Mostrar" [ref=f19e353]
            - paragraph [ref=f19e355]: ESDI dispone de diferentes modalidades de pago y opciones de financiación para facilitar el acceso a los estudios. El equipo de Admisiones puede informarte de las condiciones actualizadas, los plazos y las opciones disponibles en cada curso académico.
          - listitem [ref=f19e356]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Disponéis de programa de Becas y Ayudas?" [ref=f19e357] [cursor=pointer]':
              - paragraph [ref=f19e358]: ¿Disponéis de programa de Becas y Ayudas?
              - img "Mostrar" [ref=f19e360]
            - paragraph [ref=f19e362]: Sí. La Fundación del Diseño Textil FUNDIT ofrece un programa propio de becas, ayudas y premios para reconocer el talento y facilitar el acceso a los estudios universitarios. Entre las diferentes opciones destaca la Beca Mérito, que ofrece un descuento del 80%, así como otras convocatorias que pueden variar cada curso académico. Al tratarse de una titulación oficial universitaria, también es posible optar a becas públicas según los requisitos establecidos por las administraciones competentes.
          - listitem [ref=f19e363]:
            - 'button "Mostrar u ocultar la respuesta a: ¿En qué idiomas puedo hacer el Grado Universitario?" [ref=f19e364] [cursor=pointer]':
              - paragraph [ref=f19e365]: ¿En qué idiomas puedo hacer el Grado Universitario?
              - img "Mostrar" [ref=f19e367]
            - paragraph [ref=f19e369]: El Grado en Diseño se puede cursar en catalán, castellano e inglés, dependiendo de la mención y del grupo académico seleccionado. Esta oferta permite a los estudiantes desarrollar una formación con una clara orientación internacional.
          - listitem [ref=f19e370]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Cómo es la evaluación de las asignaturas?" [ref=f19e371] [cursor=pointer]':
              - paragraph [ref=f19e372]: ¿Cómo es la evaluación de las asignaturas?
              - img "Mostrar" [ref=f19e374]
            - paragraph [ref=f19e376]: La evaluación combina diferentes metodologías para valorar tanto los conocimientos teóricos como las competencias prácticas. Según la asignatura, se tienen en cuenta proyectos, ejercicios, presentaciones, trabajos individuales o en equipo, prácticas y pruebas de evaluación continua. El objetivo es valorar el progreso del estudiante de manera integral y aplicada a la realidad profesional del diseño.
          - listitem [ref=f19e377]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Existen costes extras en la matrícula del curso?" [ref=f19e378] [cursor=pointer]':
              - paragraph [ref=f19e379]: ¿Existen costes extras en la matrícula del curso?
              - img "Mostrar" [ref=f19e381]
            - paragraph [ref=f19e383]: La matrícula del Grado incluye el acceso en las instalaciones, talleres y equipación especializada de ESDI. Algunos materiales específicos, como materiales de taller o software adicional, pueden suponer un coste complementario. El equipo de Admisiones puede informarte de los detalles según la mención escogida.
          - listitem [ref=f19e384]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Qué salidas profesionales tiene el Grado en Diseño?" [ref=f19e385] [cursor=pointer]':
              - paragraph [ref=f19e386]: ¿Qué salidas profesionales tiene el Grado en Diseño?
              - img "Mostrar" [ref=f19e388]
            - generic [ref=f19e389]:
              - paragraph [ref=f19e390]: "El Grado en Diseño de ESDI te prepara para desarrollar tu carrera en sectores muy diversos, según la mención que elijas: Diseño Gráfico, Moda, Producto, Interiores o Audiovisual. Podrás trabajar en estudios de diseño, agencias creativas, marcas, empresas industriales, consultorías o iniciar tu propio proyecto profesional."
              - paragraph [ref=f19e391]: Algunas de las salidas más habituales son el diseño gráfico y digital, branding, dirección de arte, diseño de producto, diseño de interiores, estilismo y diseño de moda, packaging, UX/UI, comunicación visual, investigación o docencia. Además, la metodología de ESDI, basada en proyectos reales y la colaboración con empresas, facilita una incorporación al mercado laboral con experiencia práctica.
          - listitem [ref=f19e392]:
            - 'button "Mostrar u ocultar la respuesta a: ¿Se pueden hacer prácticas en empresas durante el Grado?" [ref=f19e393] [cursor=pointer]':
              - paragraph [ref=f19e394]: ¿Se pueden hacer prácticas en empresas durante el Grado?
              - img "Mostrar" [ref=f19e396]
            - generic [ref=f19e397]:
              - paragraph [ref=f19e398]: Sí. Las prácticas en empresa forman parte del plan de estudios del Grado en Diseño de ESDI-Universitat Ramon Llull. El alumnado realiza prácticas curriculares obligatorias (14 ECTS) que permiten aplicar los conocimientos adquiridos en un entorno profesional real. Además, también se pueden hacer prácticas extracurriculares para ampliar la experiencia y el contacto con el sector.
              - paragraph [ref=f19e399]: ESDI cuenta con una amplia red de empresas colaboradoras de diferentes ámbitos del diseño, donde los estudiantes desarrollan proyectos reales y adquieren experiencia antes de acabar los estudios, hecho que favorece su inserción laboral.
